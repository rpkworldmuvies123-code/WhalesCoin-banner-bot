name: Python checks
on:
  push:
    branches: [feature/auto-news-market-bot]
  pull_request:
    branches: [main]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile bot.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify WhalesCoin website export controls
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page(accept_downloads=True)
                  try:
                      response = await page.goto(
                          "https://whalescoin.io/market-highlights/gainers",
                          wait_until="domcontentloaded",
                          timeout=60000,
                      )
                      print("HTTP:", response.status if response else "no response")
                      print("TITLE:", await page.title())
                      await page.get_by_text("Share Top Coins", exact=False).first.wait_for(
                          state="visible", timeout=20000
                      )
                      print("SHARE_TOP_COINS: FOUND")
                  finally:
                      await browser.close()

          asyncio.run(main())
          PY
