name: Python checks
on:
  push:
    branches: [feature/auto-news-market-bot]
  pull_request:
    branches: [main]
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile bot.py scheduled_publisher.py tests/test_bot.py
      - run: python -m unittest discover -s tests -v
