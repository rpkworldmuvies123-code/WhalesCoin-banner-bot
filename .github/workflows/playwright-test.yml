name: Playwright Browser Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test WhalesCoin trending page
        run: |
          cat > test_playwright.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()
                  try:
                      response = await page.goto(
                          "https://whalescoin.io/market-highlights/trending",
                          wait_until="domcontentloaded",
                          timeout=60000,
                      )
                      print("HTTP_STATUS:", response.status if response else "NO_RESPONSE")
                      print("PAGE_TITLE:", await page.title())
                      print("PAGE_URL:", page.url)
                  finally:
                      await browser.close()

          asyncio.run(main())
          PY
          python test_playwright.py
